{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}Calculum{% endblock %}</title>
	<link rel="icon" href="{% static 'favicon.ico' %}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
	<link rel="stylesheet" href="{% static 'css/base.css' %}">
	{% block extra_head %}{% endblock %}
</head>
<body>
	<header>
		<div class="header-inner">
			<a class="gh-corner" href="https://github.com/AEDIROUM/calculum" target="_blank" rel="noopener" title="Voir le code source" aria-label="Voir le code source">
				<svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
					<path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
				</svg>
			</a>
			<div class="header-actions">
				<a href="{% url 'noob' %}" class="new-member-btn" title="Êtes vous nouveau ?">Êtes vous nouveau ?</a>
				<a href="{% url 'admin:index' %}" target="_blank" class="admin-btn" title="Administration">Admin</a>
			</div>
			<h1><img src="{% static 'favicon.ico' %}" alt="" width="20" height="20">Calculum UdeM</h1>
			<nav>
				<a href="/">Info</a><span class="sep">·</span>
				<a href="{% url 'meets' %}">Rencontres</a><span class="sep">·</span>
				<a href="{% url 'events' %}">Événements</a><span class="sep">·</span>
				<a href="{% url 'cheatsheet' %}">Aide-mémoire</a>
			</nav>
		</div>
	</header>
	<main>
		{% block content %}{% endblock %}
	</main>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
	<script src="{% static 'js/base.js' %}"></script>
	{% block extra_scripts %}{% endblock %}
</body>
</html>
